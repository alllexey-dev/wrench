name: wrench CI

on:
  pull_request:
  push:

jobs:
  rust-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: make format-check-rs

  html-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Biome format check
        run: make format-check-html

      - name: Run Biome lint
        run: make lint-html

  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Run mdl for check markdown format
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml

  wrench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Test
        run: make test-rs

      - name: Test examples
        run: make test-examples

      - name: Build examples
        run: make build-examples

      - uses: gacts/install-hurl@v1

      - name: Test server
        run: make test-server

  rust-lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: make lint-rs

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./script"
          version: "0.16.2"

  python-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: jakebailey/pyright-action@v3
        with:
          version: "1.1.413"

  is-variants-and-tests-actual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make generate-variants
      - run: git diff --exit-code

  rustdoc:
    needs:
      - wrench
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: |
          make docs-rustdoc
          echo '<meta http-equiv="refresh" content="0; url=wrench/index.html">' > target/doc/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-binaries:
    needs:
      - wrench
      - rust-lint
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          echo "git_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git log HEAD -1 --format=%cd)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GIT_HASH: ${{ steps.version.outputs.git_hash }}
          GIT_DATE: ${{ steps.version.outputs.git_date }}
        shell: bash
        run: |
          cargo build --release --workspace --locked
          mkdir -p dist
          for bin in wrench wrench-fmt wrench-serv; do
            cp "target/release/$bin$([ "$RUNNER_OS" = Windows ] && echo .exe)" dist/
          done

      - name: Prepare release archive
        run: |
          tar -czvf wrench-${{ runner.os }}-${{ runner.arch }}.tar.gz -C ./dist .

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wrench-${{ runner.os }}-${{ runner.arch }}
          path: wrench-${{ runner.os }}-${{ runner.arch }}.tar.gz

  publish-release:
    needs:
      - build-binaries
      - rust-formatting
      - html-formatting
      - markdown-formatting
      - python-lint
      - python-typecheck
      - rust-lint
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - run: find ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  # use `make release-image` to trigger it
  deploy-release:
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          curl -X POST -H "Content-Type: application/json" --fail-with-body \
            -d '{"task": "wrench-serv", "secret": "${{ secrets.DEPLOY_EDGE_WEBHOOK }}", "async":true}' \
            https://updater.edu.swampbuds.me/update

  build-edge-image:
    needs:
      - wrench
      - is-variants-and-tests-actual
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 30
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version metadata
        id: version
        run: |
          echo "git_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git log HEAD -1 --format=%cd)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ryukzak/wrench:edge
          platforms: linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            VERSION_SUFFIX=EDGE
            GIT_HASH=${{ steps.version.outputs.git_hash }}
            GIT_DATE=${{ steps.version.outputs.git_date }}

  deploy-edge:
    needs: build-edge-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          curl -X POST -H "Content-Type: application/json" --fail-with-body \
            -d '{"task": "wrench-serv-edge", "secret": "${{ secrets.DEPLOY_EDGE_WEBHOOK }}", "async":true}' \
            https://updater.edu.swampbuds.me/update
