[package]
name = "wrench-serv"
version = "0.6.2"
edition = "2021"
description = "Service for uploading and running Wrench test cases."
license = "BSD-3-Clause"

[dependencies]
form_urlencoded = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }
wrench = { path = ".." }
