name: total Collatz steps for 1..10000 - branches and shifts
limit: 7900000
memory_size: 0x2000
memory_mapped_io:
  0x80: [10000]
  0x84: []
reports:
  - name: Check results
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [849666]
