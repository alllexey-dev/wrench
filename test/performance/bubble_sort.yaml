name: bubble sort of 1400 LCG words, checksum sum(a[i] * (i + 1)) - loads/stores
limit: 7900000
memory_size: 0x2000
memory_mapped_io:
  0x80: [1400]
  0x84: []
reports:
  - name: Check results
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [20316259]
